name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Code Quality & Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Check formatting with ruff
        run: ruff format --check src/ tests/

      - name: Verify Zero-Chinese policy in code & tests
        run: |
          python -c "
          import os, sys, re
          zh_regex = re.compile(r'[\u4e00-\u9fff]')
          violations = []
          for root_dir in ['src', 'tests']:
              for root, dirs, files in os.walk(root_dir):
                  for f in files:
                      if f.endswith('.py'):
                          p = os.path.join(root, f)
                          with open(p, 'r', encoding='utf-8') as fp:
                              for idx, line in enumerate(fp, 1):
                                  if zh_regex.search(line):
                                      violations.append((p, idx, line.strip()))
          if violations:
              print(f'Found {len(violations)} non-English character violations in code:')
              for v in violations[:10]:
                  print(f'  {v[0]}:{v[1]}: {v[2]}')
              sys.exit(1)
          print('Zero-Chinese policy verified: pure English in src/ and tests/!')
          "

  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    needs: lint-and-format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest tests/ -v

      - name: Verify package build and twine check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
