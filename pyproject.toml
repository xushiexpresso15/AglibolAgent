[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aglibol-agent"
version = "0.1.0"
description = "Aglibol Agent: An open-source, Ollama-native multi-agent framework engineered for personal devices and limited VRAM."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Aglibol Agent Community", email = "contributors@aglibol.ai" }
]
requires-python = ">=3.11"
keywords = [
    "llm",
    "agent",
    "aglibol",
    "aglibol-agent",
    "multi-agent",
    "ollama",
    "local-ai",
    "low-vram",
    "open-source",
    "orchestration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "psutil>=5.9.0",
    "nvidia-ml-py>=12.535.0",
    "msgpack>=1.0.8",
    "pluggy>=1.5.0",
    "structlog>=24.1.0",
    "prompt_toolkit>=3.0.40",
]

[project.urls]
Homepage = "https://github.com/xushiexpresso15/AglibolAgent"
Repository = "https://github.com/xushiexpresso15/AglibolAgent.git"
Issues = "https://github.com/xushiexpresso15/AglibolAgent/issues"
Changelog = "https://github.com/xushiexpresso15/AglibolAgent/blob/main/CHANGELOG.md"
Documentation = "https://github.com/xushiexpresso15/AglibolAgent#readme"

[project.optional-dependencies]
rag = [
    "pymupdf4llm>=0.0.17",
    "pdfplumber>=0.11.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "types-psutil>=5.9.5",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
aglibol = "aglibol.cli.app:cli"
aglibol-agent = "aglibol.cli.app:cli"

# Plugin entry points for extensibility
[project.entry-points."aglibol.agents"]
planner = "aglibol.agents.planner:PlannerAgent"
coder = "aglibol.agents.coder:CoderAgent"
reviewer = "aglibol.agents.reviewer:ReviewerAgent"
writer = "aglibol.agents.writer:WriterAgent"

[project.entry-points."aglibol.tools"]
file_ops = "aglibol.tools.file_ops:register_file_tools"
shell = "aglibol.tools.shell:register_shell_tools"
search_replace = "aglibol.tools.search_replace:register_search_replace_tools"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501", "E402", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
